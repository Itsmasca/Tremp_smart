[project]
name = "awslionridealghoritm"
version = "0.1.0"
description = "matching-py — candidatos H3/PostGIS, desvíos OSRM, ranking LightGBM, preferencias Bedrock"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3==1.35.36",
    "botocore==1.35.36",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "redis>=5.1,<6",
    "asyncpg>=0.30,<1",
    "psycopg[binary]>=3.2,<4",
    "pgvector>=0.3,<1",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-mock>=3.14,<4",
    "respx>=0.21,<1",
    "jsonschema>=4.23,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requiere PostGIS real (TEST_DATABASE_URL)"]
addopts = "-m 'not integration'"
