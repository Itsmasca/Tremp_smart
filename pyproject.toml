[project]
name = "awslionridealghoritm"
version = "0.1.0"
description = "matching-py — candidatos H3/PostGIS, desvíos OSRM, ranking LightGBM, preferencias Bedrock"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3==1.35.36",
    "botocore==1.35.36",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "redis>=5.1,<6",
    "asyncpg>=0.30,<1",
    "psycopg[binary]>=3.2,<4",
    "pgvector>=0.3,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-mock>=3.14,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
